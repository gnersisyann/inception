services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:inception
    container_name: ${CONTAINER_MARIADB}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/db_password) mariadb --protocol=tcp -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis:inception
    container_name: ${CONTAINER_REDIS}
    restart: unless-stopped
    networks:
      - inception
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:inception
    container_name: ${CONTAINER_WORDPRESS}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${CONTAINER_MARIADB}
      REDIS_HOST: ${CONTAINER_REDIS}
    secrets:
      - db_password
      - credentials
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:inception
    container_name: ${CONTAINER_NGINX}
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORDPRESS_HOST: ${CONTAINER_WORDPRESS}
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "curl -fkSs --resolve $$DOMAIN_NAME:443:127.0.0.1 https://$$DOMAIN_NAME/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  ftp:
    build:
      context: ./requirements/bonus/ftp
    image: ftp:inception
    container_name: ${CONTAINER_FTP}
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    env_file:
      - .env
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  static:
    build:
      context: ./requirements/bonus/static
    image: static:inception
    container_name: ${CONTAINER_STATIC}
    restart: unless-stopped
    ports:
      - "${STATIC_PORT}:8080"
    networks:
      - inception

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer:inception
    container_name: ${CONTAINER_ADMINER}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - inception

  backup:
    build:
      context: ./requirements/bonus/backup
    image: backup:inception
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      DB_HOST: ${CONTAINER_MARIADB}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_password
    volumes:
      - wordpress_data:/var/www/html:ro
      - backup_data:/backups
    networks:
      - inception

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data:
  backup_data:
