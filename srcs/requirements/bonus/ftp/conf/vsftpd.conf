listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
file_open_mode=0664
background=NO
pam_service_name=vsftpd
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_addr_resolve=NO
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.user_list
seccomp_sandbox=NO
